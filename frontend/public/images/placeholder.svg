<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- 主图标 - 图片符号 -->
  <g transform="translate(200,150)">
    <!-- 图片框架 -->
    <rect x="-50" y="-35" width="100" height="70" rx="8" fill="none" stroke="url(#icon)" stroke-width="3"/>
    
    <!-- 山峰图标 -->
    <path d="M-35,-10 L-25,-25 L-15,-15 L-5,-30 L15,-10 L35,-10 L35,20 L-35,20 Z" fill="url(#icon)" opacity="0.6"/>
    
    <!-- 太阳/圆点 -->
    <circle cx="20" cy="-15" r="8" fill="url(#icon)" opacity="0.4"/>
    
    <!-- AI文字 -->
    <text x="0" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#icon)">AI News</text>
  </g>
</svg>